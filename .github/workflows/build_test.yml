name: Test Build (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build Test APK (arm64-v8a)
    runs-on: ubuntu-latest
    
    # 1. Pindahkan pengecekan ketersediaan secret ke variabel env di level job
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleRelease -Penable-updater

      # 2. Gunakan variabel env untuk kondisi if
      - name: Sign arm64-v8a APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Prepare arm64 APK Artifact
        run: |
          mkdir -p dist
          if [ -f "app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk" ]; then
            echo "Mengambil APK arm64-v8a (Signed)..."
            cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk dist/aniyomi-test-arm64-v8a-signed.apk
          elif [ -f "app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk" ]; then
            echo "Mengambil APK arm64-v8a (Unsigned)..."
            cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk dist/aniyomi-test-arm64-v8a-unsigned.apk
          else
            echo "File APK arm64-v8a tidak ditemukan!"
            exit 1
          fi

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: aniyomi-test-arm64-v8a-${{ github.sha }}
          path: dist/*.apk
          retention-days: 7
